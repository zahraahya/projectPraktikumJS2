<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Explorer - Bagian 21</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }

        h1 {
            margin-bottom: 20px;
        }

        .controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-bottom: 20px;
        }

        input,
        select,
        button {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
        }

        button {
            cursor: pointer;
        }

        #status {
            margin-bottom: 15px;
            font-weight: bold;
        }

        #product-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 15px;
        }

        .product-card {
            background-color: white;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        .product-card img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }

        .product-card h3 {
            margin-bottom: 8px;
        }

        .product-card p {
            margin: 5px 0;
        }

        #statistics {
            background-color: white;
            padding: 15px;
            margin-bottom: 20px;
            border-radius: 10px;
        }
    </style>
</head>

<body>

    <h1>Product Explorer</h1>

    <div class="controls">

        <input
            type="text"
            id="search-input"
            placeholder="Cari produk..."
        >

        <select id="category-select">
            <option value="all">Semua Kategori</option>
        </select>

        <select id="sort-select">
            <option value="default">Urutan Default</option>
            <option value="price-asc">Harga Terendah</option>
            <option value="price-desc">Harga Tertinggi</option>
            <option value="rating">Rating Tertinggi</option>
            <option value="title">Nama Produk</option>
        >

    </div>

    <div id="status">
        Menunggu data...
    </div>

    <div id="statistics"></div>

    <div id="product-list"></div>

    <!-- ES Module -->
    <script
        type="module"
        src="js/main.js">
    </script>

</body>

</html>
